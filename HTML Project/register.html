<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <style>
        body{
            background-color:#f5dddd;
            font-family: Georgia, serif;
        }

        h1{
            text-align:center;
            font-size:60px;
            margin-bottom:40px;
        }

        table{
            margin:auto;
            border-spacing:20px;
            font-size:22px;
        }

        td{
            padding:10px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"]{
            width:500px;
            height:35px;
        }

        .small{
            width:80px !important;
        }

        .mobile{
            width:450px !important;
        }

        textarea{
            width:500px;
            height:120px;
        }

        select{
            width:650px;
            height:40px;
            font-size:20px;
        }

        .btn{
            width:100px;
            height:40px;
            font-size:20px;
            background-color: brown;
            color: white;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>
        <table>

            <tr>
                <td>Roll no. :</td>
                <td>
                    <input type="text" placeholder="Student Roll no">
                </td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" placeholder="First Name" style="width:240px;">
                    -
                    <input type="text" placeholder="Last Name" style="width:240px;">
                </td>
            </tr>

            <tr>
                <td >Father's name :</td>
                <td>
                    <input type="text" placeholder="Father name">
                </td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td>
                    <input class="small" type="text" placeholder="Day">
                    -
                    <input class="small" type="text" placeholder="Month">
                    -
                    <input class="small" type="text" placeholder="Year">
                    (DD-MM-YYYY)
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td>
                    <input class="small" type="text" value="+91">
                    -
                    <input class="mobile" type="text">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td>
                    <input type="email" placeholder="Student email address">
                </td>
            </tr>

            <tr>
                <td>Password :</td>
                <td>
                    <input type="password">
                </td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>
--------------------- Select Current Course's ---------------------
                        </option>
                        <option>BCA</option>
                        <option>BSC</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td>
                    <input type="file">
                </td>
            </tr>

            <tr>
                <td>City :</td>
                <td>
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Address :</td>
                <td>
                    <textarea placeholder="Enter current Address"></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input class="btn" type="submit" value="Register">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
