<!DOCTYPE html>
<html lang="en">
<head></head>
    <title>Html Day2</title>
</head>
<body>
    <h1>Registration Form</h1>
    <form action="index.html">
        <fieldset >
            <legend>Personal Details</legend>
        name : <input type="text" placeholder="Enter name"><br>
        email : <input type="email" placeholder="Enter Email"><br>
        password : <input type="password" placeholder="Enter password"><br>
        Contact : <input type="number" placeholder="Enter phoneno"><br>
        Date : <input type="date" ><br>
        male<input type="radio" name="gender">
        female<input type="radio" name="gender"><br>
        java : <input type="checkbox">
        Spring : <input type="checkbox">
        React :<input type="checkbox"><br>
        Upload Resume :<input type="file">
        </fieldset>
        <fieldset>
            <legend>Address Details</legend>
            <input type="text" placeholder="Enter area name"><br>
            <select>
                <option>Select city</option>
                <option>Pune </option>
                <option>Mumbai</option>
            </select><br> <br>
            <button>submit</button>

        </fieldset>

    

    </form>
</body>
</html>
